# Example engine configuration: replays every built-in stress scenario
# against the paper venue.
#
# These thresholds are UNCALIBRATED starting points for simulation only.
# Before any live use, every value must be derived from backtests on the
# target market, reviewed and approved.
#
# Run: cargo run --release -- config/simulation.example.toml

[growth]
initial_price = 1.0
weekly_growth = 0.01            # benchmark line only, never a buy order
start_timestamp = 1767225600    # 2026-01-01T00:00:00Z

[price]
twap_window_secs = 3600
max_sample_gap_secs = 900
min_quote_depth = 5000.0
min_window_quote_volume = 100.0
max_spot_twap_deviation = 0.05
depth_reference_move = 0.02     # quote_depth = liquidity within a 2% move

[regime]
window_secs = 86400
trend_threshold = 0.03
high_daily_volatility = 0.10
extreme_move = 0.15
quote_peg_usd = 1.0
depeg_threshold = 0.02
max_depth_drop = 0.5

[liquidity]
range_sigmas = 2.0
range_horizon_days = 1.0
min_half_width = 0.02
max_half_width = 0.25
width_tolerance = 0.3
min_reposition_interval_secs = 3600
band_capital_share = 0.45       # ~4,000 of ~9,000 operational value
rebalance_tolerance = 0.02

[assets]
token_decimals = 9
quote_decimals = 6

[risk]
max_swap_quote = 2500.0
max_slippage = 0.01
min_quote_reserve = 1500.0
max_token_exposure_quote = 9000.0
max_daily_loss_quote = 900.0
max_drawdown = 0.15
max_consecutive_failures = 3
order_ttl_secs = 120            # venue refuses orders older than this
max_price_drift = 0.01          # ...or when its price moved over 1% since planning
max_swap_shortfall = 0.02       # swaps return at least 98% of spot value
max_action_cost_quote = 5.0     # ...and never pay more than this in network costs

[venue]
kind = "simulated"
fee_rate = 0.003
swap_fee_rate = 0.003
action_cost_quote = 0.25
operational_token = 4000.0      # 2,000 free inventory + ~2,000 for the band
operational_quote = 5000.0      # 3,000 reserve + ~2,000 for the band
treasury_token = 0.0
treasury_quote = 1000.0

[treasury]
budget_quote = 1000.0           # approved accumulation budget (treasury wallet)
proposal_quote = 250.0          # one proposal; an operator must approve it
min_proposal_interval_secs = 86400
proposal_ttl_secs = 21600       # unapproved proposals expire after 6 hours

[feed]
source = "scenario"
scenarios = [
    "steady_bull",
    "steady_bear",
    "sideways",
    "flash_crash",
    "pump_retrace",
    "low_liquidity",
    "liquidity_exit",
    "liquidity_inflow",
    "stable_depeg",
    "data_gap",
]
seed = 7
steps = 2016                    # 7 days of 5-minute snapshots
interval_secs = 300
start_timestamp = 1767225600
start_price = 1.0
start_quote_depth = 50000.0

[report]
ledger_dir = "target/ledgers"
