[package]
name = "pricestabilizer"
version = "0.1.0"
edition = "2024"
description = "Chain-agnostic hybrid growth market-making engine"
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"

# A single binary crate, so rustc sees every item: any unused function,
# type, field or variant fails the build. No dead code can land.
[lints.rust]
unsafe_code = "forbid"
unused = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
